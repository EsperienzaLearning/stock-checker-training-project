name: Currys Stock Checker

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UK time
    - cron: "0 19 * * *"  # 19:00 UK time
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run stock checker
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python check_currys_stock.py
